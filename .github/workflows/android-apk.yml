name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      source_zip:
        description: 'Optional ZIP filename at the repository root; leave blank to auto-detect or use checked-out files'
        required: false
        type: string
        default: ''
  push:
    branches: [main, master]
    paths:
      - '**.zip'
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'scripts/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  assemble-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare source (auto-extract uploaded ZIP when present)
        env:
          SOURCE_ZIP: ${{ inputs.source_zip }}
        run: bash scripts/prepare-zip-source.sh "$SOURCE_ZIP"

      - name: Run native unit tests (ASan + UBSan)
        run: |
          cmake -S app/src/main/cpp -B build-host -DBUILD_NES_TESTS=ON -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-sanitize-recover=undefined' \
            -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'
          cmake --build build-host -j2
          ctest --test-dir build-host --output-on-failure

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.2.12479018'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK output
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          file app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NESLauncher-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
